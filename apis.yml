aid: founders-fund
name: Founders Fund
description: >-
  Founders Fund is a San Francisco-based venture capital firm founded in 2005 by
  Peter Thiel, Ken Howery, and Luke Nosek, best known for the credo "we wanted
  flying cars, instead we got 140 characters" and a contrarian appetite for hard
  science and frontier technology over incremental consumer apps. The firm backs
  category-defining, often monopoly-scale companies across aerospace and defense,
  artificial intelligence, biotech, fintech and crypto, energy, semiconductors,
  robotics, and deep tech, investing from seed through late-stage growth with an
  increasingly concentrated, high-conviction style (its recent growth funds put
  hundreds of millions of dollars into a small number of companies). Founders
  Fund manages roughly $17 billion in assets as of 2025 and is headquartered at
  the Letterman Digital Arts Center in San Francisco's Presidio. Its portfolio
  includes many of the defining technology companies of the era, among them
  SpaceX, Palantir, Anduril, Stripe, Airbnb, Facebook, Neuralink, OpenAI,
  DeepMind, Ramp, Nubank, Spotify, and Figma.
